<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Stamp Card</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1512">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stamp Card">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#1c1512; --card:#f0e6d2; --card-edge:#e0d3b8; --ink:#3a2a1e;
    --ink-soft:#7a6550; --gold:#d4a24e; --red:#b5432f; --line:#cbb996;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #2a201a 0%, var(--bg) 60%);
    background-attachment:fixed;
    min-height:100vh;min-height:100dvh;
    font-family:"Space Mono",monospace;color:var(--card);
    display:flex;align-items:flex-start;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 16px
            calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:420px}

  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px}
  .brandmark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .brandmark span{color:var(--ink-soft)}
  .loyalty{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);text-align:right}

  .card{background:var(--card);color:var(--ink);border-radius:18px;padding:26px 24px 22px;
    position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.7), inset 0 0 0 1px var(--card-edge);overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;
    background:repeating-linear-gradient(var(--card) 0 8px,var(--line) 8px 9px);opacity:.5}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(circle at 18% 30%, rgba(122,101,80,.10) 0 2px, transparent 2px),
      radial-gradient(circle at 72% 66%, rgba(122,101,80,.08) 0 3px, transparent 3px),
      radial-gradient(circle at 44% 88%, rgba(122,101,80,.07) 0 2px, transparent 2px);
    background-size:120px 120px,160px 160px,90px 90px}

  .shopname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:27px;line-height:1;
    margin:2px 0 4px;background:transparent;border:none;color:var(--ink);width:100%;letter-spacing:-.01em;padding:0}
  .shopname:focus{outline:none;box-shadow:0 2px 0 var(--gold)}
  .tagline{font-size:11px;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:20px}
  .edit-hint{font-size:9px;color:var(--ink-soft);opacity:.6;margin-left:6px}

  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:4px 2px 6px}
  .slot{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);
    background:rgba(203,185,150,.12);display:flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;transition:transform .12s ease, background .2s ease}
  .slot:active{transform:scale(.9)}
  .slot .num{font-size:11px;color:var(--ink-soft);opacity:.55}
  .slot.free{border-color:var(--red);border-style:solid}
  .slot.free .num{color:var(--red);font-weight:700;font-size:8px;letter-spacing:.08em;
    text-transform:uppercase;text-align:center;line-height:1.1}
  .slot.stamped{border-style:solid;border-color:transparent;background:transparent}
  .slot svg{width:76%;height:76%;display:block}
  .slot .impression{transform-origin:center;animation:press .32s cubic-bezier(.2,1.4,.4,1)}
  @keyframes press{
    0%{transform:scale(1.5) rotate(var(--rot));opacity:0}
    60%{transform:scale(.86) rotate(var(--rot));opacity:1}
    100%{transform:scale(1) rotate(var(--rot));opacity:1}}

  .reward{margin-top:18px;text-align:center}
  .progress{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:14px}
  .progress b{color:var(--ink)}
  .redeem{width:100%;border:none;border-radius:12px;padding:15px;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;
    cursor:pointer;background:var(--red);color:#fff;box-shadow:0 8px 20px -8px rgba(181,67,47,.9);
    transition:transform .1s ease,filter .2s ease}
  .redeem:active{transform:translateY(1px)}
  .redeem:disabled{background:rgba(58,42,30,.12);color:var(--ink-soft);box-shadow:none;cursor:default}

  .stats{display:flex;gap:10px;margin-top:18px}
  .stat{flex:1;background:rgba(240,230,210,.05);border:1px solid rgba(240,230,210,.10);border-radius:12px;padding:12px 14px}
  .stat .k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .stat .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;line-height:1.1;margin-top:4px;color:var(--gold)}

  .privacy{margin-top:14px;font-size:9.5px;line-height:1.5;letter-spacing:.04em;color:var(--ink-soft);
    text-align:center;opacity:.85}
  .privacy b{color:var(--card);opacity:.9}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:10px;color:var(--ink-soft)}
  .reset{background:none;border:1px solid rgba(240,230,210,.14);color:var(--ink-soft);
    font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:7px 12px;border-radius:8px;cursor:pointer}
  .reset:active{transform:scale(.96)}

  /* install hint */
  .install{display:none;margin-top:14px;width:100%;border:1px dashed rgba(212,162,78,.5);
    background:rgba(212,162,78,.08);color:var(--gold);border-radius:12px;padding:12px 14px;
    font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.04em;cursor:pointer;text-align:center}
  .install.show{display:block}
  .ios-hint{display:none;margin-top:12px;font-size:10px;line-height:1.5;color:var(--ink-soft);text-align:center}
  .ios-hint.show{display:block}

  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);background:var(--card);color:var(--ink);
    padding:12px 20px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.02em;
    box-shadow:0 16px 30px -12px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .3s ease;
    z-index:20;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brandmark">STAMP<span>·</span>CARD</div>
    <div class="loyalty">Buy 9,<br>10th on the house</div>
  </div>

  <div class="card">
    <div class="grain"></div>
    <input id="shopname" class="shopname" maxlength="22" spellcheck="false" value="Daily Grind">
    <div class="tagline">Tap a cup to stamp your visit<span class="edit-hint">· tap the name to rename</span></div>

    <div id="grid" class="grid"></div>

    <div class="reward">
      <div id="progress" class="progress"></div>
      <button id="redeem" class="redeem" disabled>Fill the card to redeem</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">Free earned</div><div id="statFree" class="v">0</div></div>
      <div class="stat"><div class="k">Total stamps</div><div id="statTotal" class="v">0</div></div>
    </div>

    <div class="privacy">
      <b>No account. No sign-up.</b><br>Everything stays on this device.
    </div>

    <button id="install" class="install">Install to home screen</button>
    <div id="iosHint" class="ios-hint">To install: tap Share, then “Add to Home Screen”.</div>

    <div class="foot">
      <span>Saved on this device</span>
      <button id="reset" class="reset">Reset card</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const KEY = "coffee-card-v1";
const CARD_SIZE = 10;
const $ = (id) => document.getElementById(id);

const cupSVG = (rot) => `
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <g class="impression" style="--rot:${rot}deg" fill="var(--ink)">
      <path d="M22 34 h44 a4 4 0 0 1 4 4 v14 a20 20 0 0 1 -20 20 h-12 a20 20 0 0 1 -20 -20 v-14 a4 4 0 0 1 4 -4 z"/>
      <path d="M70 40 h6 a10 10 0 0 1 0 20 h-4 v-6 h4 a4 4 0 0 0 0 -8 h-6 z"/>
      <rect x="26" y="76" width="40" height="6" rx="3"/>
      <path d="M36 18 q-4 5 0 10 M50 16 q-4 5 0 10 M64 18 q-4 5 0 10" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".8"/>
    </g>
  </svg>`;

let state = { shopName:"Daily Grind", stamps:0, freeEarned:0, totalStamps:0 };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) state = { ...state, ...JSON.parse(raw) };
  }catch(e){ /* first run or storage blocked → defaults */ }
  $("shopname").value = state.shopName;
  render();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Couldn't save on this device"); }
}

function render(){
  const grid = $("grid");
  grid.innerHTML = "";
  for(let i=0;i<CARD_SIZE;i++){
    const el = document.createElement("div");
    const isFree = i === CARD_SIZE-1;
    const stamped = i < state.stamps;
    el.className = "slot" + (isFree?" free":"") + (stamped?" stamped":"");
    if(stamped){
      el.innerHTML = cupSVG(((i*37)%17)-8);
    }else{
      const s = document.createElement("span");
      s.className = "num";
      s.textContent = isFree ? "FREE CUP" : (i+1);
      el.appendChild(s);
      el.addEventListener("click", () => stamp(i));
    }
    grid.appendChild(el);
  }
  const remaining = CARD_SIZE - state.stamps;
  $("progress").innerHTML = state.stamps>=CARD_SIZE
    ? "Card full — your free coffee is ready"
    : `<b>${remaining}</b> more to your free coffee`;

  const btn = $("redeem");
  btn.disabled = state.stamps < CARD_SIZE;
  btn.textContent = state.stamps>=CARD_SIZE ? "Redeem free coffee ☕" : "Fill the card to redeem";

  $("statFree").textContent = state.freeEarned;
  $("statTotal").textContent = state.totalStamps;
}

function stamp(i){
  if(i !== state.stamps || state.stamps >= CARD_SIZE) return;
  state.stamps++; state.totalStamps++;
  render(); save();
  if(navigator.vibrate) navigator.vibrate(12);
  if(state.stamps===CARD_SIZE) toast("Card full! Redeem your free coffee 🎉");
}
function redeem(){
  if(state.stamps < CARD_SIZE) return;
  state.stamps = 0; state.freeEarned++;
  render(); save();
  toast("Enjoy your free coffee — new card started");
}

let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

$("redeem").addEventListener("click", redeem);
$("shopname").addEventListener("input", (e) => { state.shopName = e.target.value || "My Café"; });
$("shopname").addEventListener("blur", () => {
  if(!$("shopname").value.trim()){ $("shopname").value = "My Café"; state.shopName = "My Café"; }
  save();
});
$("reset").addEventListener("click", () => {
  if(state.stamps===0){ toast("Card's already empty"); return; }
  state.stamps = 0; render(); save(); toast("Card reset");
});

/* Install experience */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e;
  $("install").classList.add("show");
});
$("install").addEventListener("click", async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $("install").classList.remove("show");
});
// iOS Safari has no install prompt — show the manual hint (only when not already installed)
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
if(isIOS && !standalone){ $("iosHint").classList.add("show"); }

/* Offline support */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}

load();
</script>
</body>
</html>
